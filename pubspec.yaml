name: buldm
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.1
  flutter_dotenv: ^5.2.1
  onesignal_flutter: ^5.3.0
  smooth_page_indicator: ^1.2.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.0.0
  go_router: ^15.1.2
  flutter_localization: ^0.3.2
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  lottie: ^3.3.1
  google_sign_in: ^6.3.0
  font_awesome_flutter: ^10.8.0
  either_dart: ^1.0.0
  get_it: ^8.0.3
  path_provider: ^2.1.5
  hydrated_bloc: ^10.0.0
  another_flushbar: ^1.10.28
  dio: ^5.8.0+1
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2

  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0 # downgraded to 2.x for compatibility
  equatable: ^2.0.7
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  geocoding: ^4.0.0
  socket_io_client: ^3.1.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  flutter_map: ^8.1.1
  tflite_flutter: ^0.11.0
  image: ^4.0.17
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.4.0 # downgraded to 2.x for compatibility
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  get: ^4.7.2
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true

  uses-material-design: true
  assets:
    - .env
    # Only include images actually used in the app to reduce APK size
    - assets/images/darkbuldm.png
    - assets/images/lightbuldm.png
    - assets/images/pngwing.png
    - assets/images/find.png
    - assets/images/lost.png
    - assets/images/repeat.png
    - assets/images/google.png
    # Notification sound asset (also copied natively for Android/iOS notification use)

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/English/SFPRODISPLAYREGULAR.otf
          weight: 400
        - asset: assets/fonts/English/SFPRODISPLAYMEDIUM.otf
          weight: 500
        # Keep 600 for places using FontWeight.w600; only italic file available in assets
        - asset: assets/fonts/English/SFPRODISPLAYSEMIBOLDITALIC.otf
          weight: 600
          style: italic
        - asset: assets/fonts/English/SFPRODISPLAYBOLD.otf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/logobuldm.png
